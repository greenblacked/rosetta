name: CI Rosettify Plugins

# Pre-merge gate: typecheck + build + tests for the rosettify-plugins package
# on every PR that touches it. Complements publish-rosettify-plugins.yml, which
# only runs on push to main (publish time) and is not a pre-merge gate. Mirrors
# that workflow's validate/build/test steps.
on:
  pull_request:
    paths:
      - 'src/rosettify-plugins/**'
      - 'instructions/r3/**'
      - 'plugins/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: src/rosettify-plugins/package-lock.json

    - name: Install dependencies
      working-directory: ./src/rosettify-plugins
      run: npm ci

    - name: Run type validation
      working-directory: ./src/rosettify-plugins
      run: npm run typecheck

    - name: Build package
      working-directory: ./src/rosettify-plugins
      run: npm run build

    - name: Run tests
      working-directory: ./src/rosettify-plugins
      run: npm run test

    # FR-CLI-0070–0074: deterministic instruction linter. Runs after build so dist/cli.js exists;
    # lints r3 standard and lightweight-profile alike, from the repo's own instructions/ tree.
    # Exit 1 (findings) or 2 (usage error) fails this step; see src/rosettify-plugins/src/lint/.
    - name: Lint r3 instructions (standard profile)
      working-directory: ./src/rosettify-plugins
      run: node dist/cli.js --lint --release r3 --source ../..

    - name: Lint r3 instructions (lightweight profile)
      working-directory: ./src/rosettify-plugins
      run: node dist/cli.js --lint --release r3 --profile lightweight --source ../..
